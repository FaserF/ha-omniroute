execute_ai_task:
  description: Execute an arbitrary generative AI task across OmniRoute cascades.
  fields:
    prompt:
      description: The prompt or task instruction for the AI model.
      example: "Summarize today's energy consumption."
      required: true
      selector:
        text:
          multiline: true
    model:
      description: Target model or cascade alias.
      example: "coding-cascade"
      required: false
      selector:
        text: {}
    temperature:
      description: Sampling temperature between 0.0 and 2.0.
      example: 0.2
      required: false
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.05
          mode: box
    max_tokens:
      description: Maximum tokens to generate in response.
      example: 2048
      required: false
      selector:
        number:
          min: 1
          max: 32768
          mode: box
    system_prompt:
      description: Custom system instruction overriding the default.
      example: "You are an AI task specialist for Home Assistant."
      required: false
      selector:
        text:
          multiline: true

generate_image:
  description: Generate images via OmniRoute diffusion endpoints.
  fields:
    prompt:
      description: Text description of the image to generate.
      example: "A futuristic smart home in the forest during sunset."
      required: true
      selector:
        text:
          multiline: true
    model:
      description: Image generation model.
      example: "flux-schnell"
      default: "flux-schnell"
      required: false
      selector:
        text: {}
    size:
      description: Image resolution.
      example: "1024x1024"
      default: "1024x1024"
      required: false
      selector:
        select:
          options:
            - "512x512"
            - "1024x1024"
            - "1280x720"
            - "1920x1080"
    quality:
      description: Generation quality.
      example: "standard"
      default: "standard"
      required: false
      selector:
        select:
          options:
            - "standard"
            - "hd"
    n:
      description: Number of images to generate.
      example: 1
      default: 1
      required: false
      selector:
        number:
          min: 1
          max: 4
          mode: box

refresh_models:
  description: Force an immediate refresh of available models and cascade status from the gateway.

analyze_camera:
  description: Capture a snapshot from a Home Assistant camera and analyze it using OmniRoute multimodal vision models.
  fields:
    camera_entity_id:
      description: The camera entity to snapshot.
      example: "camera.front_door"
      required: true
      selector:
        entity:
          domain: camera
    prompt:
      description: What to look for or analyze in the snapshot.
      example: "Describe what you see in this security camera snapshot in detail."
      default: "Describe what you see in this security camera snapshot in detail."
      required: false
      selector:
        text:
          multiline: true
    model:
      description: Vision model or cascade to use for analysis.
      example: "coding-cascade"
      required: false
      selector:
        text: {}

generate_embedding:
  description: Generate vector embeddings for text via OmniRoute /v1/embeddings endpoint.
  fields:
    text:
      description: Text string to vectorize.
      example: "Living room ceiling light automation"
      required: true
      selector:
        text:
          multiline: true
    model:
      description: Embedding model to use.
      example: "text-embedding-3-small"
      default: "text-embedding-3-small"
      required: false
      selector:
        text: {}

flush_cache:
  description: Flush route and model resolution caches in the OmniRoute gateway.

suggest_automations:
  description: Scan Home Assistant entities and generate smart, tailored automation suggestions with valid YAML code via OmniRoute.
  fields:
    domains:
      description: Limit entity analysis to specific domains (e.g. light, switch, climate).
      example: ["light", "climate"]
      required: false
      selector:
        object: {}
    entity_limit:
      description: Maximum number of entities to feed into the prompt context.
      example: 25
      default: 30
      required: false
      selector:
        number:
          min: 5
          max: 100
          mode: box
    custom_prompt:
      description: Specific focus or custom instructions for the automation (e.g. "Focus on presence-based lighting").
      example: "Focus on energy saving when leaving home"
      required: false
      selector:
        text:
          multiline: true
    model:
      description: Model or cascade to generate automation code.
      example: "coding-cascade"
      default: "coding-cascade"
      required: false
      selector:
        text: {}
    send_notification:
      description: Whether to deliver suggestions via persistent notification in Home Assistant.
      default: true
      required: false
      selector:
        boolean: {}

